name: 'CDP Build Test Action'

description: 'builds and publishes docker image to ECR only'

inputs:
  version:
    description: 'overrides auto-versioning'
    required: false
    default: ''
  image-name:
    description: 'image of image to push (defaults to repo name)'
    required: false
    default: ${{ github.event.repository.name }}
  push:
    description: 'push docker image after building'
    required: false
    default: true
  github-token:
    description: Github Token, required for autoversioning
    required: false
  prerelease:
    description: Generate an auto-incrementing prerelease tag (for non-main branches)
    required: false
    default: "false"
  prerelease-suffix:
    description: Label used for the prerelease tag, e.g. dev, rc
    required: false
    default: "beta"
  build-secrets:
    description: 'newline separated ID=VALUE pairs exposed to the docker build as BuildKit secret mounts'
    required: false
    default: ''

runs:
  using: "composite"
  steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-${{ inputs.image-name }}-build-role

    - run: aws sts get-caller-identity
      shell: bash

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'true'

    - name: auto-version
      id: version
      if: inputs.version == ''
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        WITH_V: false
        DRY_RUN: true
        TAG_CONTEXT: ${{ inputs.prerelease == 'true' && 'branch' || '' }}
        PRERELEASE: ${{ inputs.prerelease }}
        PRERELEASE_SUFFIX: ${{ inputs.prerelease == 'true' && inputs.prerelease-suffix || '' }}

    - name: Docker Build
      uses: docker/build-push-action@v7
      with:
        context: .
        no-cache: true
        provenance: false
        sbom: false
        file: ./Dockerfile
        push: ${{ inputs.push }}
        secrets: ${{ inputs.build-secrets }}
        tags: |
          ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ inputs.image-name }}:${{ steps.version.outputs.new_tag || inputs.version }}
        labels: |
          defra.cdp.git.repo.url=${{ github.server_url }}/${{ github.repository }}
          defra.cdp.git.repo.name=${{ github.repository }}
          defra.cdp.testsuite.name=${{ inputs.image-name }}
          defra.cdp.build.run_id=${{ github.run_id }}
          git.hash=${{ github.sha }}

    - name: commit-version
      if: inputs.version == '' && (inputs.push == 'true' || inputs.push == true)
      uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        WITH_V: false
        TAG_CONTEXT: ${{ inputs.prerelease == 'true' && 'branch' || '' }}
        PRERELEASE: ${{ inputs.prerelease }}
        PRERELEASE_SUFFIX: ${{ inputs.prerelease == 'true' && inputs.prerelease-suffix || '' }}