name: 'Commit and Push Changes'
description: 'Commits and pushes changes with retry logic, optionally to a specified branch (creating it if it does not exist).'
inputs:
  commit_message:
    description: 'The commit message to use.'
    required: true
  branch_name:
    description: 'Name of the branch to commit to. If not provided, uses the current branch. Creates the branch if it does not exist.'
    required: false
  skip_ci:
    description: 'Whether to add [skip ci] to end of commit message'
    required: false
    default: "true"
outputs:
  branch_name:
    description: 'The name of the branch that was committed to.'
    value: ${{ steps.commit.outputs.branch_name }}
runs:
  using: 'composite'
  steps:
    - name: Commit and push changes
      id: commit
      shell: bash
      run: |
        # Remove leading and trailing spaces
        branch_name=$(echo "${{ inputs.branch_name }}" | xargs)

        # Determine the target branch
        if [[ -n "${branch_name}" ]]; then
          TARGET_BRANCH="${branch_name}"
          COMMIT_MESSAGE="${{ inputs.commit_message }}"
        else
          TARGET_BRANCH="$GITHUB_REF"
          if [[ "${{ inputs.skip_ci }}" == "true" ]]; then
            COMMIT_MESSAGE="${{ inputs.commit_message }} [skip ci]"
          else
            COMMIT_MESSAGE="${{ inputs.commit_message }}"
          fi
        fi

        attempts=0
        max_attempts=3

        while (( attempts < max_attempts )); do
          ((attempts += 1))

          # Add and commit changes, if there are any
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "$COMMIT_MESSAGE" || exit 1
          fi

          # Push to the target branch
          if git push origin "HEAD:$TARGET_BRANCH"; then
            echo "branch_name=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( attempts < max_attempts )); then
            echo "Push failed, rebasing onto the latest remote branch before retrying..."

            git fetch origin "$TARGET_BRANCH" || exit 1

            if ! git rebase "origin/$TARGET_BRANCH"; then
              echo "Rebase failed; cannot safely retry automatically."
              git rebase --abort
              exit 1
            fi

            sleep 1
          fi
        done

        echo "Failed to push changes after $max_attempts attempts."
        exit 1
