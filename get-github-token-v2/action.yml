name: 'Get Scoped GitHub Token'

description: >
  Gets a scoped, short-lived GitHub App installation token from the CDP
  token service (mono-lambda).  The token is restricted to the calling
  repository and expires in ~1 hour.

  Unlike the original get-github-token action, the GitHub App private key
  is never pulled down to the runner.  Token minting happens inside AWS,
  and the caller's identity is verified from their already-assumed IAM role.

inputs:
  token_service_url:
    description: >
      Full HTTPS URL of the /github/token endpoint, e.g.
      https://cdp-mono-lambda.api.management.cdp-int.defra.cloud/github/token
    required: true
  role_to_assume:
    description: >
      IAM role ARN to assume before calling the token service.
      Must be a role that is permitted in the API Gateway resource policy
      (api_gateway_allowed_principal_arns in cdp-mono-lambda.tf).
      The STS session name from the OIDC exchange encodes the calling repo —
      this is what the Lambda uses to determine which repo gets the token.
    required: true
  aws_region:
    description: AWS region for SigV4 signing
    default: eu-west-2
  username:
    description: Git user.name to configure (optional)
    required: false
  email:
    description: Git user.email to configure (optional)
    required: false

outputs:
  token:
    description: Scoped GitHub App installation token (also set as GH_TOKEN env var)
    value: ${{ steps.get-token.outputs.token }}

runs:
  using: "composite"
  steps:
    # ── Assume the specified IAM role ────────────────────────────────────────
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.role_to_assume }}

    # ── Call the token service with SigV4-signed request ────────────────────
    - name: Get scoped GitHub token
      id: get-token
      shell: python
      env:
        TOKEN_SERVICE_URL: ${{ inputs.token_service_url }}
        AWS_REGION_NAME: ${{ inputs.aws_region }}
      run: |
        import json
        import os
        import sys
        import urllib.error
        import urllib.request

        import boto3
        from botocore.auth import SigV4Auth
        from botocore.awsrequest import AWSRequest

        url = os.environ["TOKEN_SERVICE_URL"]
        region = os.environ["AWS_REGION_NAME"]

        session = boto3.Session()
        credentials = session.get_credentials()

        request = AWSRequest(
            method="POST",
            url=url,
            data="{}",
            headers={"Content-Type": "application/json"},
        )
        SigV4Auth(credentials, "execute-api", region).add_auth(request)

        http_request = urllib.request.Request(
            url=url,
            data=b"{}",
            headers=dict(request.headers),
            method="POST",
        )

        try:
            with urllib.request.urlopen(http_request) as resp:
                raw = json.loads(resp.read())
        except urllib.error.HTTPError as exc:
            print(f"::error::Token service returned HTTP {exc.code}: {exc.read().decode()}", file=sys.stderr)
            sys.exit(1)

        # The mono-lambda wraps its response as {"statusCode": 200, "body": {...}}
        body = raw.get("body", raw)
        if isinstance(body, str):
            body = json.loads(body)

        if "token" not in body:
            print(f"::error::Unexpected response from token service: {raw}", file=sys.stderr)
            sys.exit(1)

        token = body["token"]
        repo = body.get("repository", "unknown")
        expires_at = body.get("expires_at", "unknown")

        print(f"::notice::Scoped token issued for {repo}, expires {expires_at}")

        # Write token as a step output — mask it first
        print(f"::add-mask::{token}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"token={token}\n")

    # ── Export GH_TOKEN and configure git ───────────────────────────────────
    - name: Export token and configure git
      shell: bash
      env:
        TOKEN: ${{ steps.get-token.outputs.token }}
        USERNAME: ${{ inputs.username }}
        EMAIL: ${{ inputs.email }}
      run: |
        echo "GH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

        GLOBAL_GIT_CONFIG_FILE="${RUNNER_TEMP}/cdp-gitconfig"
        echo "GIT_CONFIG_GLOBAL=${GLOBAL_GIT_CONFIG_FILE}" >> "$GITHUB_ENV"
        echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

        export GIT_CONFIG_GLOBAL="${GLOBAL_GIT_CONFIG_FILE}"
        export GIT_TERMINAL_PROMPT=0

        rm -f "${GLOBAL_GIT_CONFIG_FILE}"

        if [ -d ".git" ]; then
          git config --local --unset-all http.https://github.com/.extraheader || true
        fi

        git config --file "${GLOBAL_GIT_CONFIG_FILE}" \
          url."https://x-access-token:${TOKEN}@github.com".insteadOf "https://github.com"

        if [ -n "$USERNAME" ]; then
          git config --global user.name "$USERNAME"
        fi
        if [ -n "$EMAIL" ]; then
          git config --global user.email "$EMAIL"
        fi
