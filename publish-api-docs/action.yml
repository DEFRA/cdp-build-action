name: 'CDP Publish API Docs'

description: 'Publishes a static API docs site to one folder of the CDP API hub bucket.'

inputs:
  path:
    description: Path to the API docs rendered as HTML
    required: true
  target:
    description: Folder under api/<service-name>/ to publish to, e.g. a version (1.2.3) or latest
    required: true
  service-name:
    description: Name of service to publish the docs under (defaults to repo name)
    required: false
    default: ${{ github.event.repository.name }}
  bucket:
    description: Destination S3 Bucket
    required: false
    default: "cdp-management-api-docs"
runs:
  using: "composite"
  steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-${{ inputs.service-name }}-build-role

    - run: aws sts get-caller-identity
      shell: bash

    - name: Upload the API docs to S3
      shell: bash
      env:
        DOCS_PATH: ${{ inputs.path }}
        TARGET: ${{ inputs.target }}
        SERVICE_NAME: ${{ inputs.service-name }}
        BUCKET_NAME: ${{ inputs.bucket }}
      run: |
        set -euo pipefail

        # A single folder name, so a target can't reach outside api/<service-name>/<target>/
        if ! [[ "$TARGET" =~ ^[A-Za-z0-9._-]+$ ]] || [ "$TARGET" = "." ] || [ "$TARGET" = ".." ]; then
          echo "Error: target '$TARGET' must be a single folder name, e.g. 1.2.3 or latest." >&2
          exit 1
        fi

        if [ ! -d "$DOCS_PATH" ]; then
          echo "Error: Directory '$DOCS_PATH' does not exist." >&2
          exit 1
        fi

        if [ -z "$(find "$DOCS_PATH" -mindepth 1 -type f -print -quit)" ]; then
          echo "Error: Directory '$DOCS_PATH' contains no files." >&2
          exit 1
        fi

        DEST_URI="s3://${BUCKET_NAME}/api/${SERVICE_NAME}/${TARGET}/"
        echo "Publishing API docs to ${DEST_URI}..."
        aws s3 sync "$DOCS_PATH" "$DEST_URI" --delete

        echo "### API Docs Published :rocket:" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Service:** \`${SERVICE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Target:** \`${TARGET}\`" >> "$GITHUB_STEP_SUMMARY"
