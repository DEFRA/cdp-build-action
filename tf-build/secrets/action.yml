name: "CDP Terraform Secrets"
description: "Get secrets for Terraform"

inputs:
  role_to_assume:
    description: The IAM role to assume for fetching Secrets
  gh_actions_secrets:
    description: Secret for Github Actions to run Terraform
    default: cdp/platform/gh_actions
  gh_app_private_key:
    description: Secret for Github App
    default: cdp/platform/gh_apps/DEFRA/cdp-gh-action/private-key
  use_defra_org:
    description: Boolean as to whether the action is being use in DEFRA org
    default: false

runs:
  using: "composite"
  steps:
    - name: Get GitHub Token
      id: get-token
      uses: DEFRA/cdp-build-action/get-github-token-v2@CORE-4347
      with:
        role_to_assume: arn:aws:iam::094954420758:role/github-trigger-monolambda-role
        token_service_url: https://dn6yr97qx9.execute-api.eu-west-2.amazonaws.com/management/github/token
        email: "147416134+cdp-github-action[bot]@users.noreply.github.com"
        username: "cdp-github-action[bot]"
    # Setup exectuion for AWS
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ inputs.role_to_assume }}
    - run: aws sts get-caller-identity
      shell: bash
