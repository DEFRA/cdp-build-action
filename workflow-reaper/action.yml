name: 'Workflow Reaper'
description: 'Cancel long-running workflows'

inputs:
  timeout_minutes:
    description: 'Cancel workflows running or queued longer than this many minutes'
    type: number
    default: 120
    required: false

runs:
  using: 'composite'
  steps:
    - name: Cancel long-running workflows
      shell: bash
      run: |
          CUTOFF=$(date -u -d "${{ inputs.timeout_minutes || 120 }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cancelling runs older than: $CUTOFF (${CUTOFF_MINUTES} minutes ago)"

          for STATUS in queued in_progress; do
            echo "Checking $STATUS runs..."
            IDS=$(gh run list \
              --repo "${{ github.repository }}" \
              --status "$STATUS" \
              --limit 100 \
              --json databaseId,createdAt \
              | jq -r ".[] | select(.createdAt < \"$CUTOFF\") | .databaseId")

            if [ -z "$IDS" ]; then
              echo "No stuck $STATUS runs found"
            else
              echo "Cancelling: $IDS"
              echo "$IDS" | xargs -I{} gh run cancel {} --repo "${{ github.repository }}"
            fi
          done
